name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-content:
    name: Validate Content Schemas & Curriculum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml pydantic
      - name: Run Content Validation Suite
        run: python tools/validate_content.py

  backend-tests:
    name: Backend Tests & Safety Cases
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: tst_user
          POSTGRES_PASSWORD: tst_secure_password_2026
          POSTGRES_DB: taleem_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Pytest & Safety Cases
        env:
          DATABASE_URL: postgresql+asyncpg://tst_user:tst_secure_password_2026@localhost:5432/taleem_db
          SYNC_DATABASE_URL: postgresql://tst_user:tst_secure_password_2026@localhost:5432/taleem_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: dev_jwt_secret_key_change_in_production_32char
          ENVIRONMENT: test
        run: |
          cd backend
          pytest -v

  mobile-tests:
    name: Mobile Flutter Analysis & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true
      - name: Install Flutter dependencies
        run: |
          cd mobile
          flutter pub get
      - name: Run Flutter Analyzer & Unit Tests
        run: |
          cd mobile
          flutter analyze
          flutter test

  admin-tests:
    name: Admin Web Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-web/package.json
      - name: Install npm dependencies
        run: |
          cd admin-web
          npm ci
      - name: Build & Test Admin Web
        run: |
          cd admin-web
          npm run build
